# 월가 흐름 (2026-11-23) — 미국 시장 기사 제목의 주제 비중 → macro_snapshot 'street_flow'
#
# scripts/collect-street-flow.js (backend/streetFlow.js). 최근 4일을 다시 받아 합친다(요청 25번, 1분 이내).
# 미국 장 마감(ET 16:00 = KST 06:00) 뒤, 한국 장 시작 전에 화면에 올라오도록 07:00 KST.
# 화면 표시용이라 GitHub 스케줄 지연이 있어도 다음 날 다시 받으므로 빠지는 날은 없다. 매매 신호를 만들지 않는다.
# 최초 1회: workflow_dispatch 에서 backfill=56 으로 실행해 추세선을 채운다.
name: street-flow

on:
  schedule:
    - cron: '0 22 * * *'   # 07:00 KST
  workflow_dispatch:
    inputs:
      backfill:
        description: '지난 N일을 날짜별로 다시 받기 (0 = 평소처럼 최근 4일)'
        required: false
        default: '0'

permissions:
  contents: read

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - name: Collect street flow
        run: node scripts/collect-street-flow.js --backfill="${BACKFILL:-0}"
        env:
          BACKFILL: ${{ github.event.inputs.backfill }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
