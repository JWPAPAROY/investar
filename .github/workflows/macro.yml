# 시장 흐름 탭 수집 (2026-11-15) — 연준·국면·업종 흐름·정책 뉴스·정책 사건 결과
#
# scripts/collect-macro.js → macro_snapshot / policy_news / policy_events (supabase-macro.sql)
# 화면 표시용이라 정시성이 필요 없다(GitHub Actions 지연 무해). 매매 신호를 만들지 않는다.
name: macro

on:
  schedule:
    - cron: '7 22 * * *'   # 07:07 KST — FRED·미국장 마감 반영 후
  workflow_dispatch:

permissions:
  contents: read

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - name: Collect macro dashboard data
        run: node scripts/collect-macro.js
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          KRX_AUTH_KEY: ${{ secrets.KRX_AUTH_KEY }}
