# 분기 재무 갱신 (2026-10-06, 2026-11-26 DART 로 교체)
#
# 왜: stock_financials 가 묵으면 포트폴리오가 지난 분기 BPS·ROE 로 고른다.
#   E/P+저회전(ep_lowturn)은 ROE를 직접 쓰므로 이 지연이 순위를 바꾼다.
# 2026-11-26: KIS 재무비율 API 가 2026-11-11 부터 404 → 11-14·11-21 이 전 종목 실패 후 30분 취소.
#   지금은 DART(주요계정 + 연결 회사 지배주주 몫)로 만든다. 계산 backend/dartFinancials.js,
#   KIS 값 대조 scripts/dart-financials-check.js.
#
# 주기: 매주 토요일. 이미 있는 (종목, 분기)는 건너뛰므로 첫 실행 뒤로는 늦게 공시한 회사만 받는다.
#   새 분기 첫 실행은 연결 회사 ~2,000곳 × 3보고서 호출이라 30~40분. DART 하루 한도 20,000회.
name: financials

on:
  schedule:
    - cron: '0 1 * * 6'   # 토 10:00 KST
  workflow_dispatch:

permissions:
  contents: read

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - name: Collect financials (DART) → stock_financials
        run: node scripts/collect-financials.js --push
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
