# 저PBR·저변동 포트폴리오 리밸런싱 + KIS↔KRX 대조 (v3.97, 2026-08-26)
#
# collect-market-flow 가 끝난 뒤에 돈다 — 그날 종가·시총이 DB에 들어와야 산출할 수 있다.
#   시각을 추측해 cron으로 맞추면 러너 지연(26~55분) 때문에 전일 데이터를 읽게 된다.
#   (record-lowvol-picks 가 같은 이유로 workflow_run 방식이다)
#
# 리밸런싱은 20거래일 주기이고 그 판단은 스크립트가 스스로 한다 —
#   매일 돌려도 주기가 안 되면 "아직 아님"으로 끝난다(멱등).
name: portfolio

on:
  workflow_run:
    workflows: [collect-market-flow]
    types: [completed]
  workflow_dispatch:
    inputs:
      force:
        description: '주기 무시하고 강제 리밸런싱 (true/false)'
        required: false
        default: 'false'

permissions:
  contents: read

jobs:
  rebalance:
    # 수집이 성공했을 때만. 실패한 날은 데이터가 없으니 산출해도 의미 없다.
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci

      - name: Rebalance portfolio
        run: node scripts/build-portfolio.js ${{ github.event.inputs.force == 'true' && '--force' || '' }}
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}

      # 대조는 리밸런싱과 독립이다 — 하나가 실패해도 다른 하나는 남긴다.
      - name: Compare KIS vs KRX
        if: always()
        run: node scripts/compare-sources.js --save
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          KRX_AUTH_KEY: ${{ secrets.KRX_AUTH_KEY }}
