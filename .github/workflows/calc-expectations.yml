# 기대수익 통계 산출 (v3.96)
#
# 왜 CI인가 (2026-08-25):
#   이 계산은 post-market 모드의 **마지막 단계**로 fall-through 돼 있었고, Vercel 함수는
#   maxDuration 60초에 묶여 있다. 앞 단계(패턴 수집 → 업종 전망 → 업종 지수)가 길어지면
#   조용히 잘리는 쪽은 항상 마지막인 이 단계다 — 같은 핸들러의 sector_outlook_stats는
#   2026-08-24까지 갱신됐는데 expected_return_stats는 **2026-08-14에 멈춰 있었다**(7거래일).
#   그 값이 매일 아침 텔레그램의 "기대수익 / 손익비 / 승률"에 그대로 표시된다.
#   계산 자체는 10.7초로 멀쩡하다 — 문제는 60초 벽 뒤에 서 있었다는 것.
#
# 시각: 장 마감(15:30 KST) 뒤, 가격 추적 cron이 끝난 18:50 KST(=09:50 UTC).
name: calc-expectations

on:
  schedule:
    - cron: '50 9 * * 1-5'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  calc:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - name: Calculate expected return stats
        run: node scripts/calc-expectations.js
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          KIS_APP_KEY: ${{ secrets.KIS_APP_KEY }}
          KIS_APP_SECRET: ${{ secrets.KIS_APP_SECRET }}
